<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Character encoding & responsive viewport -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Basic SEO -->
  <title>HTML Template</title>
  <meta name="description" content="A short description of the page for search engines.">

  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <!-- Open Graph / social sharing -->
  <meta property="og:title" content="Page Title">
  <meta property="og:description" content="A short description of the page.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://example.com/">
  <meta property="og:image" content="https://example.com/og-image.jpg">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <!-- Site header / nav -->
  </header>

  <main>
    <!-- Main page content -->
  </main>

  <footer>
    <!-- Site footer -->
  </footer>

  <!-- JavaScript (deferred so it runs after HTML is parsed) -->
  <script src="script.js" defer></script>
</body>
</html>
