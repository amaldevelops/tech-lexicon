conky.config = {
    alignment = 'top_right',
    background = false,

    update_interval = 1,
    double_buffer = true,

    minimum_width = 380,
    maximum_width = 380,

    gap_x = 25,
    gap_y = 50,

    own_window = true,
    own_window_type = 'desktop',

    -- Background
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 215,

    border_inner_margin = 15,
    border_outer_margin = 0,

    draw_borders = true,
    draw_outline = false,
    draw_shades = false,

    border_width = 2,
    border_color = '8A2BE2',

    use_xft = true,
    xftalpha = 0.95,

    font = 'DejaVu Sans Mono:size=9',

    default_color = 'FFFFFF',

    cpu_avg_samples = 2,
    net_avg_samples = 2,

    no_buffers = true,
    text_buffer_size = 4096,

    temperature_unit = 'celsius',
};

conky.text = [[

${color 8A2BE2}${font DejaVu Sans Mono:bold:size=18}SYSTEM MONITOR${font}${color}
${color 444444}━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━${color}

${color 00D9FF}${font DejaVu Sans Mono:bold:size=11}▸ SYSTEM${font}${color}

${color FFFFFF}Host:       ${color 00D9FF}${nodename}${color}
${color FFFFFF}OS:         ${color 00D9FF}${sysname} ${kernel}${color}
${color FFFFFF}Architecture:${color 00D9FF} ${machine}${color}
${color FFFFFF}Uptime:     ${color 00FF88}${uptime}${color}
${color FFFFFF}Processes:  ${color FF3366}${processes}${color}
${color FFFFFF}Running:    ${color FF3366}${running_processes}${color}

${color 444444}──────────────────────────────────${color}

${color FF8C00}${font DejaVu Sans Mono:bold:size=11}▸ CPU${font}${color}

${color FFFFFF}CPU:        ${color FF8C00}${cpu}%${color}
${color FFFFFF}Frequency:  ${color FF8C00}${freq_g} GHz${color}

${color FF8C00}${cpubar 8,350}${color}

${color FFFFFF}Core 1:     ${color FF8C00}${cpu cpu1}%${color}
${color FFFFFF}Core 2:     ${color FF8C00}${cpu cpu2}%${color}
${color FFFFFF}Core 3:     ${color FF8C00}${cpu cpu3}%${color}
${color FFFFFF}Core 4:     ${color FF8C00}${cpu cpu4}%${color}

${cpugraph 40,350 FF8C00 FF4500}

${color 444444}──────────────────────────────────${color}

${color 00FF88}${font DejaVu Sans Mono:bold:size=11}▸ MEMORY${font}${color}

${color FFFFFF}RAM Used:   ${color 00FF88}${mem} / ${memmax}${color}
${color FFFFFF}RAM:        ${color 00FF88}${memperc}%${color}

${color 00FF88}${membar 8,350}${color}

${color FFFFFF}Swap:       ${color 00FF88}${swap} / ${swapmax}${color}
${color FFFFFF}Swap:       ${color 00FF88}${swapperc}%${color}

${color 444444}──────────────────────────────────${color}

${color FF3366}${font DejaVu Sans Mono:bold:size=11}▸ STORAGE${font}${color}

${color FFFFFF}Root:       ${color FF3366}${fs_used /} / ${fs_size /}${color}
${color FFFFFF}Usage:      ${color FF3366}${fs_used_perc /}%${color}

${color FF3366}${fs_bar 8,350 /}${color}

${color FFFFFF}Read:       ${color FF3366}${diskio_read}${color}
${color FFFFFF}Write:      ${color FF3366}${diskio_write}${color}

${color 444444}──────────────────────────────────${color}

${color 00D9FF}${font DejaVu Sans Mono:bold:size=11}▸ NETWORK${font}${color}

${color FFFFFF}Interface:  ${color 00D9FF}${gw_iface}${color}
${color FFFFFF}Local IP:   ${color 00D9FF}${addr ${gw_iface}}${color}
${color FFFFFF}Gateway:    ${color 00D9FF}${gw_ip}${color}

${color FFFFFF}↓ Download: ${color 00D9FF}${downspeed}${color}
${downspeedgraph 40,350 00D9FF 0066FF}

${color FFFFFF}↑ Upload:   ${color 8A2BE2}${upspeed}${color}
${upspeedgraph 40,350 8A2BE2 FF00FF}

${color 444444}──────────────────────────────────${color}

${color FF00FF}${font DejaVu Sans Mono:bold:size=11}▸ TOP PROCESSES${font}${color}

${color FFFFFF}${top name 1} ${color FF00FF}${top cpu 1}%${color}
${color FFFFFF}${top name 2} ${color FF00FF}${top cpu 2}%${color}
${color FFFFFF}${top name 3} ${color FF00FF}${top cpu 3}%${color}
${color FFFFFF}${top name 4} ${color FF00FF}${top cpu 4}%${color}
${color FFFFFF}${top name 5} ${color FF00FF}${top cpu 5}%${color}

${color 444444}──────────────────────────────────${color}

${color FFFF00}${font DejaVu Sans Mono:bold:size=11}▸ TOP MEMORY${font}${color}

${color FFFFFF}${top_mem name 1} ${color FFFF00}${top_mem mem_res 1}${color}
${color FFFFFF}${top_mem name 2} ${color FFFF00}${top_mem mem_res 2}${color}
${color FFFFFF}${top_mem name 3} ${color FFFF00}${top_mem mem_res 3}${color}
${color FFFFFF}${top_mem name 4} ${color FFFF00}${top_mem mem_res 4}${color}
${color FFFFFF}${top_mem name 5} ${color FFFF00}${top_mem mem_res 5}${color}

${color 444444}──────────────────────────────────${color}

${color FF6600}${font DejaVu Sans Mono:bold:size=11}▸ SYSTEM TEMPERATURE${font}${color}

${color FFFFFF}CPU Temp:   ${color FF6600}${acpitemp}°C${color}

${color 444444}──────────────────────────────────${color}

${color 8A2BE2}${font DejaVu Sans Mono:bold:size=11}▸ TIME${font}${color}

${color FFFFFF}${font DejaVu Sans Mono:bold:size=18}${time %H:%M:%S}${font}${color}
${color 8A2BE2}${time %A, %d %B %Y}${color}

${color 444444}━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━${color}

]];